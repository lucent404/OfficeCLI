name: MCP format policy
on:
  push:
    branches: ['main', 'codex/mcp-allowed-formats']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: dotnet publish src/officecli/officecli.csproj -c Release -r linux-x64 -o publish --nologo
      - run: python tests/mcp-formats.py publish/officecli
      - run: python tests/mcp-progress.py publish/officecli
      - uses: actions/upload-artifact@v4
        with:
          name: officecli-linux-x64-mcp-formats
          path: publish/officecli
